name: Build and Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Required for creating releases

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r relay_simulator/requirements.txt

      - name: Build executable
        run: python build_exe.py

      - name: Verify build
        run: |
          if (Test-Path "dist\RelaySimulator.exe") {
            Write-Host "✓ Build successful! Executable found at dist\RelaySimulator.exe"
            $fileSize = (Get-Item "dist\RelaySimulator.exe").Length / 1MB
            Write-Host "  File size: $([math]::Round($fileSize, 2)) MB"
          } else {
            Write-Error "✗ Build failed - executable not found"
            exit 1
          }
        shell: pwsh

      - name: Extract version from tag
        id: get_version
        run: |
          if ($env:GITHUB_REF -match "refs/tags/(.*)") {
            $version = $matches[1]
          } else {
            $version = "manual-build"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
        shell: pwsh

      - name: Create distribution package
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"

          # Create package directory
          New-Item -ItemType Directory -Force -Path "package/RelaySimulator"

          # Copy executable
          Copy-Item "dist/RelaySimulator.exe" -Destination "package/RelaySimulator/"

          # Copy examples
          Copy-Item "examples" -Destination "package/RelaySimulator/examples" -Recurse

          # Copy documentation
          Copy-Item "README.md" -Destination "package/RelaySimulator/"
          Copy-Item "LICENSE" -Destination "package/RelaySimulator/"

          # Create a quick start guide
          @"
          # Relay Simulator $version - Quick Start

          ## Running the Application
          Double-click RelaySimulator.exe to launch the application.

          ## Example Circuits
          Open any .rsim file from the 'examples' folder:
          - File → Open
          - Navigate to the examples folder
          - Select an example circuit

          ## Documentation
          See README.md for full documentation and usage instructions.

          ## Support
          For issues or questions, visit: https://github.com/pjchick/Relay-Simulator
          "@ | Out-File -FilePath "package/RelaySimulator/QUICKSTART.txt" -Encoding UTF8

          # Create ZIP archive
          $zipName = "RelaySimulator-$version-Windows.zip"
          Compress-Archive -Path "package/RelaySimulator" -DestinationPath $zipName -Force

          Write-Host "✓ Package created: $zipName"
          $zipSize = (Get-Item $zipName).Length / 1MB
          Write-Host "  Package size: $([math]::Round($zipSize, 2)) MB"

          # Store zip name for later steps
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh
        id: create_package

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Relay Simulator ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Relay Simulator ${{ steps.get_version.outputs.VERSION }}

            ### Downloads
            - **Complete Package**: RelaySimulator-${{ steps.get_version.outputs.VERSION }}-Windows.zip
              - Includes executable, example circuits, and documentation
              - Recommended for new users
            - **Standalone Executable**: RelaySimulator.exe
              - Just the executable, no examples

            ### Installation
            **Option 1: Complete Package (Recommended)**
            1. Download `RelaySimulator-${{ steps.get_version.outputs.VERSION }}-Windows.zip`
            2. Extract the ZIP file
            3. Run `RelaySimulator.exe` from the extracted folder
            4. Open example circuits from the `examples` folder

            **Option 2: Standalone Executable**
            1. Download `RelaySimulator.exe`
            2. Run the executable - no installation needed!

            ### Requirements
            - Windows 10 or later
            - No Python installation required

            ### What's New
            See the commit history for details on changes in this release.

            ---
            **Note**: Windows Defender may flag the executable on first run. This is a false positive common with PyInstaller executables. You can safely allow it to run.
          draft: false
          prerelease: false

      - name: Upload Release Asset - Complete Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.create_package.outputs.ZIP_NAME }}
          asset_name: ${{ steps.create_package.outputs.ZIP_NAME }}
          asset_content_type: application/zip

      - name: Upload Release Asset - Standalone Executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/RelaySimulator.exe
          asset_name: RelaySimulator.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload Build Artifact (for manual workflow runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RelaySimulator-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.create_package.outputs.ZIP_NAME }}
          retention-days: 30
