name: Build Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r relay_simulator/requirements.txt

      - name: Build executable
        run: python build/build_exe.py

      - name: Verify build
        run: |
          if (Test-Path "dist\RelaySimulator.exe") {
            Write-Host "✓ Build successful! Executable found at dist\RelaySimulator.exe"
            $fileSize = (Get-Item "dist\RelaySimulator.exe").Length / 1MB
            Write-Host "  File size: $([math]::Round($fileSize, 2)) MB"
          } else {
            Write-Error "✗ Build failed - executable not found"
            exit 1
          }
        shell: pwsh

      - name: Create distribution package
        run: |
          # Create package directory
          New-Item -ItemType Directory -Force -Path "package/RelaySimulator"

          # Copy executable
          Copy-Item "dist/RelaySimulator.exe" -Destination "package/RelaySimulator/"

          # Copy examples
          Copy-Item "examples" -Destination "package/RelaySimulator/examples" -Recurse

          # Copy documentation
          Copy-Item "README.md" -Destination "package/RelaySimulator/"
          Copy-Item "LICENSE" -Destination "package/RelaySimulator/"

          # Create a quick start guide
          @"
          # Relay Simulator - Quick Start

          ## Running the Application
          Double-click RelaySimulator.exe to launch the application.

          ## Example Circuits
          Open any .rsim file from the 'examples' folder:
          - File → Open
          - Navigate to the examples folder
          - Select an example circuit

          ## Documentation
          See README.md for full documentation and usage instructions.

          ## Support
          For issues or questions, visit: https://github.com/pjchick/Relay-Simulator
          "@ | Out-File -FilePath "package/RelaySimulator/QUICKSTART.txt" -Encoding UTF8

          # Create ZIP archive
          Compress-Archive -Path "package/RelaySimulator" -DestinationPath "RelaySimulator-test-build.zip" -Force

          Write-Host "✓ Package created: RelaySimulator-test-build.zip"
          $zipSize = (Get-Item "RelaySimulator-test-build.zip").Length / 1MB
          Write-Host "  Package size: $([math]::Round($zipSize, 2)) MB"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelaySimulator-test-build
          path: RelaySimulator-test-build.zip
          retention-days: 7
